name: Build EVE Command Center

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate patch notes
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '' }
          ./scripts/Validate-ReleaseNotes.ps1 -Tag $tag

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore EveCommandCenter.csproj

      - name: Command Center regression checks
        run: dotnet run --project Tests/CommandCenter.Checks.csproj -c Release

      - name: Publish EVE Command Center EXE
        run: dotnet publish EveCommandCenter.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/publish

      - name: Upload main-branch build artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v6
        with:
          name: EVE-Command-Center-Windows-x64
          path: artifacts/publish/**
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Package public download
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          [xml]$project = Get-Content EveCommandCenter.csproj
          if ("v$($project.Project.PropertyGroup.Version)" -ne $env:GITHUB_REF_NAME) {
              throw 'Tag must match project version'
          }

          New-Item -ItemType Directory -Path artifacts/release -Force | Out-Null
          Copy-Item NOTICE.md artifacts/publish/NOTICE.md
          Copy-Item README.md artifacts/publish/README.md

          Compress-Archive `
            -Path 'artifacts/publish/EVE Command Center.exe', artifacts/publish/NOTICE.md, artifacts/publish/README.md `
            -DestinationPath artifacts/release/EVE-Command-Center-Windows-x64.zip

          Copy-Item 'artifacts/publish/EVE Command Center.exe' artifacts/release/EVE.Command.Center.exe

          Get-ChildItem artifacts/release -File |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object {
                "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))"
            } |
            Set-Content artifacts/release/SHA256SUMS.txt

      - name: Publish GitHub Release directly
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "artifacts/release/EVE-Command-Center-Windows-x64.zip" `
            "artifacts/release/EVE.Command.Center.exe" `
            "artifacts/release/SHA256SUMS.txt" `
            --verify-tag `
            --title "EVE Command Center $env:GITHUB_REF_NAME" `
            --notes-file RELEASE_NOTES.md